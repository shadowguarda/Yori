name: Build signed APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor (standard = all languages + Firebase, dev = English only, no Firebase)'
        default: standard
        type: choice
        options:
          - standard
          - dev
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and sign
    runs-on: ubuntu-latest
    env:
      FLAVOR: ${{ github.event.inputs.flavor || 'standard' }}
      BUILD_TOOLS: 35.0.0

    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android build tools
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;${BUILD_TOOLS}"

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Build release APKs
        run: |
          FLAVOR_CAP="$(echo "${FLAVOR:0:1}" | tr a-z A-Z)${FLAVOR:1}"
          ./gradlew assemble${FLAVOR_CAP}Release

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "::add-mask::$STORE_PASSWORD"
            echo "KS_PASS=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KS_KEY_PASS=${KEY_PASSWORD_SECRET:-$STORE_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "::warning::No SIGNING_KEY secret set. Signing with a throwaway key generated for this run; updates will NOT install over a build signed with a different key. Add SIGNING_KEY, ALIAS, KEY_STORE_PASSWORD and KEY_PASSWORD secrets for a permanent key."
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -alias yori \
              -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Yori, O=Yori, C=IN"
            echo "KS_ALIAS=yori" >> "$GITHUB_ENV"
            echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
            echo "KS_KEY_PASS=$PASS" >> "$GITHUB_ENV"
          fi

      - name: Align and sign APKs
        run: |
          set -e
          BT="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}"
          OUT=signed
          mkdir -p "$OUT"
          for apk in app/build/outputs/apk/${FLAVOR}/release/*-unsigned.apk; do
            name="$(basename "$apk" -unsigned.apk)"
            "$BT/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/$name-aligned.apk"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias "$KS_ALIAS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KS_KEY_PASS" \
              --out "$OUT/yori-${name#app-}.apk" \
              "$RUNNER_TEMP/$name-aligned.apk"
            "$BT/apksigner" verify --print-certs "$OUT/yori-${name#app-}.apk" | head -3
          done
          ls -lh "$OUT"

      - name: Upload signed APKs
        uses: actions/upload-artifact@v7
        with:
          name: yori-signed-apk-${{ github.run_number }}
          path: signed/*.apk
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: yori-mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/${{ env.FLAVOR }}Release
          if-no-files-found: warn
